<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI FAQ Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f8;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 650px;

            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 120px;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            resize: vertical;
        }

        button {
            width: 100%;

            margin-top: 15px;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .answer {
            margin-top: 25px;

            padding: 20px;

            background: #eef6ff;

            border-radius: 10px;

            line-height: 1.6;
        }

        .answer h3 {
            margin-top: 0;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🤖 AI FAQ Chatbot</h1>

        <p class="description">
            Ask a question and the chatbot will find the most relevant FAQ answer.
        </p>

        <form method="POST">

            <textarea
                name="question"
                placeholder="Type your question here..."
                required>{{ question }}</textarea>

            <button type="submit">
                Ask Chatbot
            </button>

        </form>

        {% if answer %}

        <div class="answer">

            <h3>🤖 Chatbot Response</h3>

            <p>{{ answer }}</p>

        </div>

        {% endif %}

    </div>

</body>

</html>
